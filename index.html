<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AlpenBox</title>
<style>
:root{--bg:#edf6f9;--surface:#fff;--ink:#16302f;--muted:#587073;--line:#d3e5e8;--accent:#006d77;--coral:#e29578;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0c1d20;--surface:#132a2e;--ink:#e4f1f3;--muted:#9bb5b9;--line:#24403f;--accent:#83c5be;--err:#f2938b}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.doboz{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;
  box-shadow:0 8px 30px rgba(0,60,66,.10)}
h1{margin:0;font-size:28px;color:var(--accent);letter-spacing:-.01em}
.alcim{margin:2px 0 20px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0 0 14px;color:var(--muted)}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:flex;align-items:center;gap:8px;margin:12px 0 16px;color:var(--muted);font-size:14px;cursor:pointer}
label.chk input{accent-color:var(--accent);width:18px;height:18px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 15px/1 inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
.hiba{color:var(--err);min-height:1.4em;margin:10px 0 0;font-size:14px}
</style>
</head>
<body>
<form class="doboz" id="urlap" autocomplete="off">
  <h1>AlpenBox</h1>
  <div class="alcim">Válogatott osztrák prémium termékek</div>
  <p>Add meg a tőlünk kapott jelszót.</p>
  <input type="password" id="jelszo" placeholder="Jelszó" required autofocus>
  <label class="chk"><input type="checkbox" id="emlekezz" checked> Emlékezz rám 30 napig</label>
  <button id="gomb">Belépés</button>
  <div class="hiba" id="hiba"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const tar = {
  get(){ try { return JSON.parse(localStorage.getItem(TAROLO) || "null"); } catch(e) { return null; } },
  set(v){ try { localStorage.setItem(TAROLO, JSON.stringify(v)); } catch(e) {} },
  del(){ try { localStorage.removeItem(TAROLO); } catch(e) {} },
};

async function kulcsJelszobol(jelszo){
  const alap = await crypto.subtle.importKey("raw", new TextEncoder().encode(jelszo), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(SO), iterations: ITER}, alap, 256);
}
async function visszafejt(nyers){
  const k = await crypto.subtle.importKey("raw", nyers, "AES-GCM", false, ["decrypt"]);
  const d = b64(ADAT);
  const sima = await crypto.subtle.decrypt({name: "AES-GCM", iv: d.slice(0, 12)}, k, d.slice(12));
  return new TextDecoder().decode(sima);
}
// A katalógus a teljes oldal helyére kerül. Csak a betöltés végén szabad: amíg a böngésző még
// olvassa a belépőoldalt, a document.write hozzáfűzne (a két oldal egymás mellé kerülne).
async function mutat(html){
  if (document.readyState !== "complete") await new Promise(r => window.addEventListener("load", r, {once: true}));
  document.open(); document.write(html); document.close();
}

(async () => {
  const t = tar.get();
  if (t && t.lejar > Date.now()) {
    const urlap = document.getElementById("urlap");
    urlap.style.visibility = "hidden";                       // ne villanjon fel a belépés
    try { await mutat(await visszafejt(b64(t.k))); return; }
    catch(e) { tar.del(); urlap.style.visibility = ""; }     // új jelszó: újra be kell lépni
  } else if (t) tar.del();
})();

document.getElementById("urlap").addEventListener("submit", async e => {
  e.preventDefault();
  const gomb = document.getElementById("gomb"), hiba = document.getElementById("hiba");
  gomb.disabled = true; hiba.textContent = "";
  try {
    const nyers = await kulcsJelszobol(document.getElementById("jelszo").value);
    const html = await visszafejt(nyers);
    if (document.getElementById("emlekezz").checked) tar.set({k: b64e(nyers), lejar: Date.now() + 30 * 864e5});
    await mutat(html);
  } catch(err) {
    hiba.textContent = "Hibás jelszó.";
    gomb.disabled = false;
  }
});
</script>
